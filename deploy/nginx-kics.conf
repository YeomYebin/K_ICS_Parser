# /etc/nginx/conf.d/kics.conf
# nginx 리버스 프록시: 큰 PDF 업로드 허용 + 긴 LLM 타임아웃 + 비밀번호(basic auth)

server {
    listen 80;
    server_name _;   # 도메인이 있으면 여기에 (예: kics.example.com)

    # 업로드 파일 크기 한도 (동양 9MB 등 대비 여유있게)
    client_max_body_size 50m;

    location / {
        # 비밀번호 보호 (아래 DEPLOY_EC2.md 의 htpasswd 생성 참고)
        auth_basic "K-ICS Parser";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 추출이 오래 걸리므로 타임아웃 넉넉히 (10분)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
