# /etc/nginx/conf.d/kics.conf
# nginx 리버스 프록시: 큰 PDF 업로드 허용 + 긴 LLM 타임아웃
# (비밀번호 보호는 앱 자체 로그인 페이지에서 처리 — .env 의 APP_PASSWORD)

server {
    listen 80;
    server_name _;   # 도메인이 있으면 여기에 (예: kics.example.com)

    # 업로드 파일 크기 한도 (동양 9MB 등 대비 여유있게)
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 추출이 오래 걸리므로 타임아웃 넉넉히 (10분)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
