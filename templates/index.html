<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-ICS 경영공시 파서</title>
  <style>
    :root { --line:#d0d5dd; --head:#1f3864; --accent:#2f5496; --warn:#c0392b; }
    * { box-sizing: border-box; }
    body { font-family: "Malgun Gothic","맑은 고딕",system-ui,sans-serif; margin:0;
           background:#f5f6f8; color:#1a1a1a; }
    header { background:var(--head); color:#fff; padding:18px 28px; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:4px 0 0; font-size:13px; opacity:.85; }
    main { max-width:1200px; margin:24px auto; padding:0 20px; }

    #drop { border:2px dashed var(--accent); border-radius:12px; background:#fff;
            padding:32px; text-align:center; cursor:pointer; transition:.15s; }
    #drop.drag { background:#eef3fb; border-color:var(--head); }
    #drop p { margin:6px 0; color:#555; }
    #drop strong { color:var(--accent); }

    .toolbar { display:flex; gap:12px; align-items:center; margin:18px 0 10px; flex-wrap:wrap; }
    button { font-size:14px; border:none; border-radius:8px; padding:9px 16px; cursor:pointer; }
    button.primary { background:var(--accent); color:#fff; }
    button.primary:disabled { background:#9db2d6; cursor:not-allowed; }
    button.ghost { background:#fff; border:1px solid var(--line); }
    #status { font-size:13px; color:#555; }

    table { width:100%; border-collapse:collapse; background:#fff; margin-top:8px;
            box-shadow:0 1px 3px rgba(0,0,0,.08); }
    th, td { border:1px solid var(--line); padding:9px 10px; font-size:14px; }
    thead th { background:#e7edf7; color:var(--head); font-weight:700; text-align:center; }
    thead th.q { background:var(--head); color:#fff; }
    td.name { text-align:center; font-weight:600; cursor:pointer; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; }
    td.ratio { text-align:center; font-variant-numeric:tabular-nums; }
    tr.data:hover { background:#f3f7ff; }
    td.ratio.warn { background:#fdecec; color:var(--warn); font-weight:700; }
    .warnicon { cursor:help; }
    tr.detail td { background:#fafbfe; color:#333; font-size:13px; line-height:1.6;
                   white-space:pre-wrap; }
    tr.detail .label { color:var(--accent); font-weight:700; margin-right:6px; }
    tr.err td { background:#fff5f5; color:var(--warn); text-align:left; }
    .caret { display:inline-block; width:12px; color:#888; }
    .hint { font-size:12px; color:#888; margin-top:6px; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid #cbd5e1;
            border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;
            vertical-align:-2px; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>K-ICS 경영공시 PDF 파서</h1>
    <p>보험사 정기 경영공시 PDF(회사별 1파일)를 올리면 지급여력 수치를 추출합니다. · 단위: 억원</p>
  </header>

  <main>
    <div id="drop">
      <p>📄 <strong>PDF 파일을 여기로 끌어놓거나 클릭</strong>하여 선택하세요 (여러 개 가능)</p>
      <p class="hint">회사당 1개 파일 · 파일당 1회 LLM(Bedrock Opus) 호출</p>
      <input id="fileInput" type="file" accept="application/pdf" multiple hidden>
    </div>

    <div class="toolbar">
      <button id="downloadBtn" class="primary" disabled>⬇ 엑셀 다운로드</button>
      <button id="clearBtn" class="ghost">초기화</button>
      <span id="status"></span>
    </div>

    <table id="resultTable">
      <thead>
        <tr>
          <th class="q" id="qHeader">'26.03월</th>
          <th>K-ICS 비율<sup>(*)</sup></th>
          <th>가용자본</th>
          <th>요구자본</th>
          <th>기본자본</th>
          <th>보완자본</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="hint">* 회사명(행)을 클릭하면 '주요 변동요인'이 펼쳐집니다. K-ICS 비율 셀이 붉으면 검산(가용÷요구×100) 불일치입니다.</p>
  </main>

  <script>
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('fileInput');
    const tbody = document.getElementById('tbody');
    const statusEl = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const qHeader = document.getElementById('qHeader');

    let rows = [];  // 추출 성공 행 보관

    const fmt = n => (n === null || n === undefined || n === '') ? '-'
                     : Number(n).toLocaleString('ko-KR');
    const fmtRatio = n => (n === null || n === undefined || n === '') ? '-'
                     : Number(n).toFixed(1);

    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('drag');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));
    clearBtn.addEventListener('click', () => {
      rows = []; tbody.innerHTML = ''; statusEl.textContent = '';
      downloadBtn.disabled = true; fileInput.value = '';
    });
    downloadBtn.addEventListener('click', downloadExcel);

    async function handleFiles(fileList) {
      const files = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.pdf'));
      if (!files.length) return;
      let done = 0;
      for (const file of files) {
        statusEl.innerHTML = `<span class="spin"></span>처리 중 (${done+1}/${files.length}): ${file.name}`;
        const rowId = addPendingRow(file.name);
        try {
          const fd = new FormData();
          fd.append('file', file);
          const res = await fetch('/extract', { method:'POST', body: fd });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || '추출 실패');
          fillRow(rowId, data);
          rows.push(data);
          if (data.quarter) qHeader.textContent = data.quarter;
        } catch (err) {
          fillError(rowId, file.name, err.message);
        }
        done++;
      }
      statusEl.textContent = `완료: ${rows.length}개 성공 / ${files.length}개 중`;
      downloadBtn.disabled = rows.length === 0;
    }

    let rowSeq = 0;
    function addPendingRow(fileName) {
      const id = 'r' + (rowSeq++);
      const tr = document.createElement('tr');
      tr.className = 'data'; tr.id = id;
      tr.innerHTML = `<td class="name">${escapeHtml(shortFromName(fileName))}</td>
        <td colspan="5" style="color:#888"><span class="spin"></span>추출 중…</td>`;
      tbody.appendChild(tr);
      return id;
    }

    function fillRow(id, d) {
      const tr = document.getElementById(id);
      const warn = d.ratio_warning;
      const warnTip = warn && d.kics_ratio_calc != null
        ? ` title="검산값(가용÷요구×100) = ${d.kics_ratio_calc}, 추출값 = ${fmtRatio(d.kics_ratio)}"` : '';
      tr.innerHTML =
        `<td class="name"><span class="caret">▸</span>${escapeHtml(d.display_name || d.company || '')}</td>
         <td class="ratio ${warn ? 'warn' : ''}"${warnTip}>${fmtRatio(d.kics_ratio)}${warn ? ' <span class="warnicon">⚠</span>' : ''}</td>
         <td class="num">${fmt(d.available_capital)}</td>
         <td class="num">${fmt(d.required_capital)}</td>
         <td class="num">${fmt(d.tier1_capital)}</td>
         <td class="num">${fmt(d.tier2_capital)}</td>`;
      tr.querySelector('.name').addEventListener('click', () => toggleDetail(tr, d));
    }

    function fillError(id, fileName, msg) {
      const tr = document.getElementById(id);
      tr.className = 'err';
      tr.innerHTML = `<td class="name">${escapeHtml(shortFromName(fileName))}</td>
        <td colspan="5">⚠ 실패: ${escapeHtml(msg)}</td>`;
    }

    function toggleDetail(tr, d) {
      const next = tr.nextElementSibling;
      const caret = tr.querySelector('.caret');
      if (next && next.classList.contains('detail')) {
        next.remove(); if (caret) caret.textContent = '▸'; return;
      }
      const detail = document.createElement('tr');
      detail.className = 'detail';
      const cf = d.change_factors ? escapeHtml(d.change_factors) : '(주요 변동요인 정보 없음)';
      detail.innerHTML = `<td colspan="6"><span class="label">주요 변동요인</span>${cf}</td>`;
      tr.after(detail);
      if (caret) caret.textContent = '▾';
    }

    async function downloadExcel() {
      const res = await fetch('/download', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ rows, quarter: qHeader.textContent })
      });
      if (!res.ok) { alert('엑셀 생성 실패'); return; }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'K-ICS_현황.xlsx';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    function shortFromName(fileName) {
      const m = fileName.match(/[（(]([^）)]+)[）)]/);
      return (m ? m[1] : fileName.replace(/\.pdf$/i,'')).slice(0, 16);
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
