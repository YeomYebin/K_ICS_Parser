<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-ICS 파서 · 로그인</title>
  <style>
    :root { --head:#1f3864; --accent:#2f5496; --warn:#c0392b; }
    * { box-sizing: border-box; }
    body { font-family: "Malgun Gothic","맑은 고딕",system-ui,sans-serif; margin:0;
           background:#f5f6f8; color:#1a1a1a; min-height:100vh;
           display:flex; align-items:center; justify-content:center; }
    .card { background:#fff; padding:32px 28px; border-radius:14px; width:320px;
            box-shadow:0 4px 20px rgba(0,0,0,.10); text-align:center; }
    h1 { font-size:18px; color:var(--head); margin:0 0 4px; }
    p.sub { font-size:13px; color:#888; margin:0 0 20px; }
    input[type=password] { width:100%; padding:11px 12px; font-size:15px;
            border:1px solid #d0d5dd; border-radius:8px; outline:none; }
    input[type=password]:focus { border-color:var(--accent); }
    button { width:100%; margin-top:12px; padding:11px; font-size:15px; border:none;
             border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
    .error { color:var(--warn); font-size:13px; margin-top:10px; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1>K-ICS 경영공시 파서</h1>
    <p class="sub">비밀번호를 입력하세요</p>
    <input type="password" name="password" placeholder="비밀번호" autofocus required>
    <button type="submit">접속</button>
    {% if error %}<div class="error">비밀번호가 올바르지 않습니다.</div>{% endif %}
  </form>
</body>
</html>
